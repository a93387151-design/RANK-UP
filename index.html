
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RANK UP - SSC MTS Mock Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5fb;color:#172554;font-family:Arial,sans-serif}
header{background:#102b59;color:white;text-align:center;padding:20px}
header h1{margin:0;font-size:29px}
main{max-width:750px;margin:18px auto;padding:12px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 12px #0001}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:bold}
#timer{color:#dc2626}
#progress{height:8px;background:#e5e7eb;border-radius:8px;margin:16px 0}
#bar{height:8px;background:#2563eb;width:0;border-radius:8px}
#question{font-size:18px;line-height:1.6;margin:20px 0}
.option{display:block;border:1px solid #cbd5e1;padding:13px;margin:10px 0;border-radius:9px;cursor:pointer}
.option:has(input:checked){background:#dbeafe;border-color:#2563eb}
.option input{margin-right:9px}
button{border:0;background:#1d5ed0;color:white;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
#result{display:none;margin-top:15px}
.review{border-top:1px solid #ddd;padding:12px 0;line-height:1.6}
.small{color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🚀 RANK UP</h1>
<p>SSC MTS | Day 1 Mock Test</p>
<p>Malayalam + English</p>
</header>
<main>
<div class="card" id="test">
<div class="top">
<span>SSC MTS – 50 Questions</span>
<span id="timer">60:00</span>
</div>
<div id="progress"><div id="bar"></div></div>
<div class="top">
<span id="count">Question 1 / 50</span>
<span id="answered">Answered: 0</span>
</div>
<div id="question"></div>
<div id="options"></div>
<div class="controls">
<button id="prev" onclick="move(-1)">Previous</button>
<button id="next" onclick="move(1)">Next</button>
<button onclick="submitTest()">Submit Test</button>
</div>
<p class="small">Choose one answer for each question. You can return to previous questions.</p>
</div>
<div class="card" id="result">
<h2>Test Result</h2>
<h1 id="score"></h1>
<p id="details"></p>
<div id="review"></div>
<button onclick="location.reload()">Try Again</button>
</div>
</main>
<script>
const questions = [
["What is 25% of 240? / 240-ന്റെ 25% എത്ര?",["40","50","60","80"],2,"25% = 1/4. 240 ÷ 4 = 60."],
["Find the next number: 2, 6, 12, 20, 30, ? / അടുത്ത സംഖ്യ കണ്ടെത്തുക.",["36","40","42","44"],2,"വ്യത്യാസം 4, 6, 8, 10, അടുത്തത് 12. 30+12=42."],
["What is the square of 15? / 15-ന്റെ വർഗ്ഗം എത്ര?",["125","200","225","250"],2,"15 × 15 = 225."],
["A man buys an item for ₹400 and sells it for ₹500. Find profit percentage. / ലാഭശതമാനം?",["20%","25%","30%","15%"],1,"ലാഭം 100. ലാഭശതമാനം = 100/400 × 100 = 25%."],
["Find the HCF of 12 and 18. / 12, 18 എന്നിവയുടെ ഉസാഘ എത്ര?",["3","6","9","12"],1,"12, 18 എന്നിവയെ ഹരിക്കുന്ന ഏറ്റവും വലിയ സംഖ്യ 6 ആണ്."],
["If 5 pens cost ₹50, what is the cost of 8 pens? / 8 പേനകളുടെ വില?",["₹60","₹70","₹80","₹90"],2,"ഒരു പേന ₹10. 8 പേനയ്ക്ക് ₹80."],
["Simplify: 48 ÷ 6 × 2 / ലഘൂകരിക്കുക.",["4","8","16","24"],2,"ഇടത്തുനിന്ന് വലത്തോട്ട്: 48÷6=8; 8×2=16."],
["What is the average of 10, 20 and 30? / ശരാശരി എത്ര?",["15","20","25","30"],1,"(10+20+30)÷3 = 20."],
["A train travels 120 km in 2 hours. Find its speed. / വേഗത എത്ര?",["40 km/h","50 km/h","60 km/h","70 km/h"],2,"വേഗത = ദൂരം/സമയം = 120/2 = 60 km/h."],
["What is 3/5 of 100? / 100-ന്റെ 3/5 എത്ര?",["30","40","50","60"],3,"100 × 3/5 = 60."],
["Find the odd one out. / വ്യത്യസ്തമായത് കണ്ടെത്തുക.",["2","3","5","9"],3,"2, 3, 5 അഭാജ്യസംഖ്യകളാണ്; 9 അല്ല."],
["If CAT is coded as DBU, how is DOG coded? / DOG-ന്റെ കോഡ്?",["EPH","EOG","FPH","DPH"],0,"ഓരോ അക്ഷരത്തിനും അടുത്ത അക്ഷരം: D→E, O→P, G→H."],
["Complete: A, C, E, G, ? / അടുത്ത അക്ഷരം?",["H","I","J","K"],1,"ഓരോ തവണയും ഒരു അക്ഷരം വിട്ട് മുന്നോട്ട്: I."],
["Ravi is taller than Manu. Manu is taller than Anu. Who is shortest? / ഏറ്റവും ഉയരം കുറഞ്ഞത് ആര്?",["Ravi","Manu","Anu","Cannot say"],2,"Ravi > Manu > Anu. അതിനാൽ Anu."],
["Find the missing number: 5, 10, 20, 40, ? / അടുത്ത സംഖ്യ?",["50","60","70","80"],3,"ഓരോ സംഖ്യയും 2 കൊണ്ട് ഗുണിക്കുന്നു. 40×2=80."],
["Which is different? / വ്യത്യസ്തമായത് ഏത്?",["Apple","Mango","Carrot","Banana"],2,"Carrot ഒരു പച്ചക്കറിയാണ്; മറ്റുള്ളവ പഴങ്ങളാണ്."],
["If today is Monday, what day will it be after 10 days? / 10 ദിവസത്തിന് ശേഷം?",["Wednesday","Thursday","Friday","Saturday"],1,"10÷7 ശേഷിപ്പ് 3. തിങ്കളാഴ്ചയ്ക്ക് 3 ദിവസം ശേഷം വ്യാഴം."],
["Book is related to Reading as Food is related to _____. / ബന്ധം പൂർത്തിയാക്കുക.",["Cooking","Eating","Writing","Sleeping"],1,"പുസ്തകം വായിക്കുന്നു; ഭക്ഷണം കഴിക്കുന്നു."],
["How many sides does a hexagon have? / ഷഡ്ഭുജത്തിന് എത്ര വശങ്ങൾ?",["5","6","7","8"],1,"Hexagon എന്നത് 6 വശങ്ങളുള്ള ബഹുഭുജമാണ്."],
["Find the next number: 1, 4, 9, 16, 25, ? / അടുത്ത സംഖ്യ?",["30","32","36","49"],2,"ഇവ 1², 2², 3², 4², 5². അടുത്തത് 6²=36."],
["Who is known as the Father of the Indian Constitution? / ഇന്ത്യൻ ഭരണഘടനയുടെ ശിൽപി ആര്?",["Mahatma Gandhi","Dr. B. R. Ambedkar","Jawaharlal Nehru","Sardar Patel"],1,"ഡോ. ബി. ആർ. അംബേദ്കർ ഭരണഘടനാ കരട് സമിതിയുടെ അധ്യക്ഷനായിരുന്നു."],
["What is the capital of India? / ഇന്ത്യയുടെ തലസ്ഥാനം?",["Mumbai","Kolkata","New Delhi","Chennai"],2,"ഇന്ത്യയുടെ തലസ്ഥാനം ന്യൂഡൽഹിയാണ്."],
["Which is the largest planet in the Solar System? / സൗരയൂഥത്തിലെ ഏറ്റവും വലിയ ഗ്രഹം?",["Earth","Mars","Jupiter","Venus"],2,"വ്യാഴം (Jupiter) ആണ് ഏറ്റവും വലിയ ഗ്രഹം."],
["Which gas do plants absorb during photosynthesis? / പ്രകാശസംശ്ലേഷണത്തിൽ സസ്യങ്ങൾ ആഗിരണം ചെയ്യുന്ന വാതകം?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2,"സസ്യങ്ങൾ കാർബൺ ഡൈ ഓക്സൈഡ് ആഗിരണം ചെയ്യുന്നു."],
["What is the national animal of India? / ഇന്ത്യയുടെ ദേശീയ മൃഗം?",["Lion","Tiger","Elephant","Leopard"],1,"ഇന്ത്യയുടെ ദേശീയ മൃഗം കടുവയാണ്."],
["Which is the longest river in India? / ഇന്ത്യയിലെ ഏറ്റവും നീളം കൂടിയ നദി?",["Yamuna","Godavari","Ganga","Narmada"],2,"ഇന്ത്യയിലെ ഏറ്റവും നീളം കൂടിയ നദിയായി ഗംഗയെ പൊതുവേ കണക്കാക്കുന്നു."],
["Who was the first President of India? / ഇന്ത്യയുടെ ആദ്യ രാഷ്ട്രപതി?",["Dr. Rajendra Prasad","S. Radhakrishnan","Zakir Hussain","A. P. J. Abdul Kalam"],0,"ഡോ. രാജേന്ദ്ര പ്രസാദ് ആയിരുന്നു ആദ്യ രാഷ്ട്രപതി."],
["Where is the headquarters of ISRO? / ISRO ആസ്ഥാനം എവിടെ?",["New Delhi","Mumbai","Bengaluru","Hyderabad"],2,"ISRO-യുടെ ആസ്ഥാനം ബെംഗളൂരുവിലാണ്."],
["Which vitamin is produced in the skin by sunlight? / സൂര്യപ്രകാശം മൂലം ചർമ്മത്തിൽ ഉത്പാദിപ്പിക്കുന്ന വിറ്റാമിൻ?",["Vitamin A","Vitamin B12","Vitamin C","Vitamin D"],3,"സൂര്യപ്രകാശം വിറ്റാമിൻ D ഉത്പാദനത്തിന് സഹായിക്കുന്നു."],
["Which organ pumps blood in the human body? / രക്തം പമ്പ് ചെയ്യുന്ന അവയവം?",["Lungs","Heart","Kidney","Liver"],1,"ഹൃദയമാണ് ശരീരത്തിലേക്ക് രക്തം പമ്പ് ചെയ്യുന്നത്."],
["Choose the synonym of 'Brave'. / Brave എന്ന വാക്കിന്റെ പര്യായം?",["Cowardly","Courageous","Weak","Lazy"],1,"Brave = Courageous (ധൈര്യമുള്ള)."],
["Choose the antonym of 'Ancient'. / Ancient-ന്റെ വിപരീതം?",["Old","Historic","Modern","Past"],2,"Ancient = പുരാതനമായത്; Modern = ആധുനികം."],
["Choose the correct spelling. / ശരിയായ അക്ഷരവിന്യാസം തിരഞ്ഞെടുക്കുക.",["Seperate","Separate","Seperete","Seprate"],1,"ശരിയായ spelling: Separate."],
["Fill in the blank: She _____ to school every day.",["go","going","goes","gone"],2,"She എന്ന ഏകവചന subject-നൊപ്പം simple present-ൽ goes ഉപയോഗിക്കുന്നു."],
["What is the plural of 'Child'? / Child-ന്റെ ബഹുവചനം?",["Childs","Children","Childes","Childrens"],1,"Child-ന്റെ irregular plural Children ആണ്."],
["Choose the correct article: He is _____ honest man.",["a","an","the","no article"],1,"Honest എന്ന വാക്കിൽ h നിശ്ശബ്ദമാണ്; vowel sound ആയതിനാൽ an."],
["Choose the opposite of 'Expand'. / Expand-ന്റെ വിപരീതം?",["Increase","Enlarge","Contract","Extend"],2,"Expand = വികസിപ്പിക്കുക; Contract = ചുരുക്കുക."],
["Identify the verb: 'Birds fly in the sky.' / ക്രിയ കണ്ടെത്തുക.",["Birds","Fly","Sky","The"],1,"Fly ആണ് പ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന verb."],
["Fill in: I have lived here _____ 2020.",["for","since","from","by"],1,"ഒരു നിശ്ചിത തുടക്കസമയം സൂചിപ്പിക്കുമ്പോൾ since ഉപയോഗിക്കുന്നു."],
["Choose the correct sentence.",["He don't know.","He doesn't know.","He not know.","He isn't know."],1,"He എന്ന subject-നൊപ്പം doesn't ആണ് ശരി."],
["What is 7 × 8? / 7 × 8 എത്ര?",["48","54","56","64"],2,"7 × 8 = 56."],
["Find 15% of 200. / 200-ന്റെ 15% എത്ര?",["20","25","30","35"],2,"200 × 15/100 = 30."],
["A number divided by 4 gives 12. Find the number. / സംഖ്യ കണ്ടെത്തുക.",["36","40","48","52"],2,"12 × 4 = 48."],
["What is the perimeter of a square with side 5 cm? / ചുറ്റളവ്?",["10 cm","15 cm","20 cm","25 cm"],2,"ചതുരത്തിന്റെ ചുറ്റളവ് = 4×വശം = 20 cm."],
["Convert 0.5 into a fraction. / ഭിന്നസംഖ്യയായി എഴുതുക.",["1/4","1/2","2/3","3/4"],1,"0.5 = 5/10 = 1/2."],
["Which number is divisible by 3? / 3 കൊണ്ട് നിശ്ശേഷം ഹരിക്കാവുന്നത്?",["124","221","315","401"],2,"3+1+5=9; 9, 3 കൊണ്ട് ഹരിക്കാം."],
["Find the LCM of 4 and 6. / ലസാഘ എത്ര?",["8","10","12","24"],2,"4, 6 എന്നിവയുടെ ഏറ്റവും ചെറിയ പൊതു ഗുണിതം 12."],
["A person walks 3 km north and 4 km east. How far is the person from the starting point? / ആരംഭസ്ഥാനത്തുനിന്നുള്ള ദൂരം?",["5 km","6 km","7 km","8 km"],0,"3-4-5 സമകോണ ത്രികോണം. ദൂരം 5 km."],
["Which is the smallest prime number? / ഏറ്റവും ചെറിയ അഭാജ്യസംഖ്യ?",["0","1","2","3"],2,"2 ആണ് ഏറ്റവും ചെറിയ അഭാജ്യസംഖ്യയും ഏക ഇരട്ട അഭാജ്യസംഖ്യയും."],
["If  x + 15 = 40, find x. / x എത്ര?",["15","20","25","30"],2,"x = 40−15 = 25."],
["How many days are there in a leap year? / അധിവർഷത്തിൽ എത്ര ദിവസം?",["364","365","366","367"],2,"അധിവർഷത്തിൽ ഫെബ്രുവരിക്ക് 29 ദിവസം; ആകെ 366 ദിവസം."]
];

let current=0, answers=Array(questions.length).fill(-1), seconds=3600, finished=false;
const $=id=>document.getElementById(id);
function render(){
 const q=questions[current];
 $("count").textContent=`Question ${current+1} / ${questions.length}`;
 $("answered").textContent="Answered: "+answers.filter(x=>x!==-1).length;
 $("bar").style.width=((current+1)/questions.length*100)+"%";
 $("question").textContent=q[0];
 $("options").innerHTML=q[1].map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?"checked":""}> ${String.fromCharCode(65+i)}. ${o}</label>`).join("");
 document.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener("change",e=>{answers[current]=Number(e.target.value);$("answered").textContent="Answered: "+answers.filter(x=>x!==-1).length;}));
 $("prev").disabled=current===0;
 $("next").disabled=current===questions.length-1;
}
function move(n){if(finished)return;current=Math.max(0,Math.min(questions.length-1,current+n));render();}
function submitTest(){
 if(finished)return;
 if(!confirm("Submit your test now? / പരീക്ഷ സമർപ്പിക്കട്ടേ?"))return;
 finished=true;clearInterval(clock);
 let correct=0,wrong=0,blank=0;
 questions.forEach((q,i)=>{if(answers[i]===q[2])correct++;else if(answers[i]===-1)blank++;else wrong++;});
 $("test").style.display="none";$("result").style.display="block";
 $("score").textContent=correct+" / "+questions.length;
 $("details").textContent=`Correct: ${correct} | Wrong: ${wrong} | Not Answered: ${blank} | Score: ${correct} marks (practice scoring)`;
 $("review").innerHTML="<h3>Answer Key & Malayalam Explanations</h3>"+questions.map((q,i)=>`<div class="review"><b>Q${i+1}. ${q[0]}</b><br>Your answer: ${answers[i]===-1?"Not answered":q[1][answers[i]]}<br><b>Correct answer: ${q[1][q[2]]}</b><br>${q[3]}</div>`).join("");
 window.scrollTo(0,0);
}
function tick(){
 if(finished)return;
 seconds--;
 $("timer").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
 if(seconds<=0){alert("Time is over!");submitTest();}
}
render();
const clock=setInterval(tick,1000);
</script>
</body>
</html>
