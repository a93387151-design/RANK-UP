<script>
const questions = [
["What is 25% of 240?","240-ന്റെ 25% എത്ര?",["40","50","60","70"],2,"25% = 1/4. 240 ÷ 4 = 60."],
["Find the next number: 2, 6, 12, 20, 30, ?","അടുത്ത സംഖ്യ കണ്ടെത്തുക: 2, 6, 12, 20, 30, ?",["36","40","42","44"],2,"വ്യത്യാസങ്ങൾ 4, 6, 8, 10, 12 ആണ്. 30 + 12 = 42."],
["The HCF of 18 and 24 is:","18-ന്റെയും 24-ന്റെയും HCF എത്ര?",["3","6","9","12"],1,"18, 24 എന്നിവയുടെ ഏറ്റവും വലിയ പൊതു ഘടകം 6 ആണ്."],
["A man buys an item for ₹400 and sells it for ₹500. Profit percentage?","₹400-ന് വാങ്ങിയ സാധനം ₹500-ന് വിറ്റാൽ ലാഭശതമാനം എത്ര?",["20%","25%","30%","15%"],1,"ലാഭം = 100. ലാഭശതമാനം = 100/400 × 100 = 25%."],
["Simplify: 15 × 4 ÷ 3","ലഘൂകരിക്കുക: 15 × 4 ÷ 3",["15","20","25","30"],1,"15 × 4 = 60; 60 ÷ 3 = 20."],
["If 5 pens cost ₹60, what is the cost of 8 pens?","5 പേനയ്ക്ക് ₹60 ആണെങ്കിൽ 8 പേനയുടെ വില എത്ര?",["₹84","₹90","₹96","₹100"],2,"ഒരു പേനയുടെ വില ₹12. 8 × 12 = ₹96."],
["Find the average of 10, 20, 30, 40.","10, 20, 30, 40 എന്നിവയുടെ ശരാശരി എത്ര?",["20","25","30","35"],1,"ആകെ 100. 100 ÷ 4 = 25."],
["A train travels 120 km in 2 hours. Find its speed.","ഒരു ട്രെയിൻ 2 മണിക്കൂറിൽ 120 km സഞ്ചരിക്കുന്നു. വേഗത എത്ര?",["40 km/h","50 km/h","60 km/h","70 km/h"],2,"വേഗത = ദൂരം / സമയം = 120/2 = 60 km/h."],
["What is the square of 17?","17-ന്റെ വർഗം എത്ര?",["279","289","299","309"],1,"17 × 17 = 289."],
["Find 3/5 of 100.","100-ന്റെ 3/5 എത്ര?",["40","50","60","70"],2,"100 × 3/5 = 60."],
["A number increased by 15 becomes 45. Find the number.","ഒരു സംഖ്യയോട് 15 കൂട്ടിയാൽ 45 കിട്ടുന്നു. സംഖ്യ ഏത്?",["25","30","35","40"],1,"45 - 15 = 30."],
["The perimeter of a square with side 8 cm is:","8 cm വശമുള്ള സമചതുരത്തിന്റെ ചുറ്റളവ് എത്ര?",["16 cm","24 cm","32 cm","64 cm"],2,"ചുറ്റളവ് = 4 × വശം = 4 × 8 = 32 cm."],
["What is 0.5 × 0.2?","0.5 × 0.2 എത്ര?",["0.01","0.1","1","10"],1,"5 × 2 = 10; രണ്ട് decimal സ്ഥാനങ്ങൾ ചേർത്താൽ 0.10 = 0.1."],
["Find the LCM of 4 and 6.","4-ന്റെയും 6-ന്റെയും LCM എത്ര?",["8","10","12","24"],2,"4, 6 എന്നിവയുടെ ഏറ്റവും ചെറിയ പൊതു ഗുണിതം 12 ആണ്."],
["A shop gives 10% discount on ₹500. Selling price?","₹500-ന് 10% വിലക്കുറവ് നൽകിയാൽ വിൽപ്പനവില എത്ര?",["₹400","₹425","₹450","₹475"],2,"വിലക്കുറവ് ₹50. വിൽപ്പനവില = ₹500 - ₹50 = ₹450."],
["Choose the odd one out: 3, 5, 7, 9","വ്യത്യസ്തമായത് കണ്ടെത്തുക: 3, 5, 7, 9",["3","5","7","9"],3,"3, 5, 7 അഭാജ്യസംഖ്യകളാണ്. 9 ഒരു അഭാജ്യസംഖ്യയല്ല."],
["Complete the series: A, C, E, G, ?","ശ്രേണി പൂർത്തിയാക്കുക: A, C, E, G, ?",["H","I","J","K"],1,"ഓരോ തവണയും ഒരു അക്ഷരം ഒഴിവാക്കുന്നു. അടുത്തത് I."],
["If CAT is coded as DBU, how is DOG coded?","CAT എന്നത് DBU ആണെങ്കിൽ DOG എങ്ങനെ എഴുതാം?",["EPH","EOG","FPH","DPH"],0,"ഓരോ അക്ഷരത്തിനും അടുത്ത അക്ഷരം ഉപയോഗിക്കുന്നു. D→E, O→P, G→H."],
["Ravi is facing North. He turns right. Which direction is he facing?","രവി വടക്കോട്ട് നോക്കി നിൽക്കുന്നു. വലത്തോട്ട് തിരിഞ്ഞാൽ ഏത് ദിശ?",["South","East","West","North"],1,"വടക്കിന്റെ വലതുവശം കിഴക്കാണ്."],
["Find the missing number: 5, 10, 20, 40, ?","കാണാതായ സംഖ്യ കണ്ടെത്തുക: 5, 10, 20, 40, ?",["45","60","80","100"],2,"ഓരോ സംഖ്യയും 2 കൊണ്ട് ഗുണിക്കുന്നു. 40 × 2 = 80."],
["Which is different? Apple, Mango, Carrot, Banana","വ്യത്യസ്തമായത് ഏത്? Apple, Mango, Carrot, Banana",["Apple","Mango","Carrot","Banana"],2,"Carrot ഒരു പച്ചക്കറിയാണ്; ബാക്കിയുള്ളവ പഴങ്ങളാണ്."],
["If today is Monday, what day will it be after 10 days?","ഇന്ന് തിങ്കളാഴ്ചയാണെങ്കിൽ 10 ദിവസത്തിന് ശേഷം ഏത് ദിവസം?",["Wednesday","Thursday","Friday","Saturday"],1,"10 ÷ 7 ശേഷി 3. തിങ്കളാഴ്ചയ്ക്ക് 3 ദിവസം ശേഷം വ്യാഴാഴ്ച."],
["Find the next letter: B, D, G, K, P, ?","അടുത്ത അക്ഷരം കണ്ടെത്തുക: B, D, G, K, P, ?",["T","U","V","W"],2,"വ്യത്യാസം +2, +3, +4, +5, അടുത്തത് +6. P-യ്ക്ക് ശേഷം V."],
["A is taller than B. B is taller than C. Who is the shortest?","A-യ്ക്ക് B-നേക്കാൾ ഉയരമുണ്ട്. B-യ്ക്ക് C-നേക്കാൾ ഉയരമുണ്ട്. ഏറ്റവും ഉയരം കുറഞ്ഞത് ആര്?",["A","B","C","Cannot say"],2,"A > B > C. അതിനാൽ C ആണ് ഏറ്റവും ഉയരം കുറഞ്ഞത്."],
["How many sides does a hexagon have?","ഒരു ഷഡ്ഭുജത്തിന് എത്ര വശങ്ങളുണ്ട്?",["5","6","7","8"],1,"Hexagon എന്നത് ആറ് വശങ്ങളുള്ള ആകൃതിയാണ്."],
["Who is known as the Father of the Indian Constitution?","ഇന്ത്യൻ ഭരണഘടനയുടെ പിതാവ് എന്നറിയപ്പെടുന്നത് ആര്?",["Mahatma Gandhi","Dr. B. R. Ambedkar","Jawaharlal Nehru","Sardar Patel"],1,"ഡോ. ബി. ആർ. അംബേദ്കർ ഭരണഘടനാ രൂപീകരണ സമിതിയുടെ അധ്യക്ഷനായിരുന്നു."],
["What is the capital of India?","ഇന്ത്യയുടെ തലസ്ഥാനം ഏത്?",["Mumbai","Chennai","New Delhi","Kolkata"],2,"ന്യൂഡൽഹിയാണ് ഇന്ത്യയുടെ തലസ്ഥാനം."],
["Which is the national animal of India?","ഇന്ത്യയുടെ ദേശീയ മൃഗം ഏത്?",["Lion","Tiger","Elephant","Leopard"],1,"ബംഗാൾ കടുവയാണ് ഇന്ത്യയുടെ ദേശീയ മൃഗം."],
["Which planet is known as the Red Planet?","ചുവന്ന ഗ്രഹം എന്നറിയപ്പെടുന്നത് ഏത്?",["Venus","Mars","Jupiter","Saturn"],1,"ഇരുമ്പ് ഓക്സൈഡ് കാരണം ചൊവ്വയ്ക്ക് ചുവപ്പ് നിറം കാണപ്പെടുന്നു."],
["Who was the first President of India?","ഇന്ത്യയുടെ ആദ്യ രാഷ്ട്രപതി ആര്?",["Dr. Rajendra Prasad","Dr. Radhakrishnan","Zakir Husain","V. V. Giri"],0,"ഡോ. രാജേന്ദ്ര പ്രസാദ് ആയിരുന്നു ഇന്ത്യയുടെ ആദ്യ രാഷ്ട്രപതി."],
["Which is the largest state in India by area?","വിസ്തീർണ്ണത്തിൽ ഇന്ത്യയിലെ ഏറ്റവും വലിയ സംസ്ഥാനം ഏത്?",["Madhya Pradesh","Maharashtra","Rajasthan","Uttar Pradesh"],2,"വിസ്തീർണ്ണത്തിൽ രാജസ്ഥാനാണ് ഇന്ത്യയിലെ ഏറ്റവും വലിയ സംസ്ഥാനം."],
["Where is the headquarters of ISRO?","ISRO-യുടെ ആസ്ഥാനം എവിടെയാണ്?",["New Delhi","Bengaluru","Hyderabad","Mumbai"],1,"ISRO-യുടെ ആസ്ഥാനം ബെംഗളൂരുവിലാണ്."],
["Which gas do plants absorb during photosynthesis?","പ്രകാശസംശ്ലേഷണ സമയത്ത് സസ്യങ്ങൾ ആഗിരണം ചെയ്യുന്ന വാതകം ഏത്?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2,"സസ്യങ്ങൾ പ്രകാശസംശ്ലേഷണത്തിന് കാർബൺ ഡൈ ഓക്സൈഡ് ഉപയോഗിക്കുന്നു."],
["What is the currency of Japan?","ജപ്പാന്റെ നാണയം ഏത്?",["Yuan","Yen","Won","Dollar"],1,"ജപ്പാന്റെ ഔദ്യോഗിക നാണയം യെൻ ആണ്."],
["Which is the longest river in India?","ഇന്ത്യയിലെ ഏറ്റവും നീളം കൂടിയ നദി ഏത്?",["Yamuna","Ganga","Godavari","Narmada"],1,"ഇന്ത്യയ്ക്കുള്ളിലെ ഒഴുക്കിന്റെ അടിസ്ഥാനത്തിൽ ഗംഗയാണ് ഏറ്റവും നീളം കൂടിയ നദി."],
["Who wrote the Indian national anthem?","ഇന്ത്യൻ ദേശീയഗാനം രചിച്ചത് ആര്?",["Bankim Chandra Chatterjee","Rabindranath Tagore","Sarojini Naidu","Subramania Bharati"],1,"ജനഗണമന രചിച്ചത് രവീന്ദ്രനാഥ ടാഗോറാണ്."],
["Which organ pumps blood in the human body?","മനുഷ്യശരീരത്തിൽ രക്തം പമ്പ് ചെയ്യുന്ന അവയവം ഏത്?",["Lungs","Brain","Heart","Kidney"],2,"ഹൃദയമാണ് ശരീരത്തിലുടനീളം രക്തം പമ്പ് ചെയ്യുന്നത്."],
["What is the chemical symbol of water?","വെള്ളത്തിന്റെ രാസസൂത്രം ഏത്?",["CO2","H2O","O2","NaCl"],1,"രണ്ട് ഹൈഡ്രജൻ ആറ്റങ്ങളും ഒരു ഓക്സിജൻ ആറ്റവും ചേർന്നതാണ് H2O."],
["Which festival is known as the festival of lights?","ദീപങ്ങളുടെ ഉത്സവം എന്നറിയപ്പെടുന്നത് ഏത്?",["Onam","Diwali","Holi","Eid"],1,"ദീപാവലി ദീപങ്ങളുടെ ഉത്സവം എന്നറിയപ്പെടുന്നു."],
["Choose the synonym of 'Happy'.","'Happy' എന്ന വാക്കിന്റെ സമാനാർത്ഥം തിരഞ്ഞെടുക്കുക.",["Sad","Joyful","Angry","Weak"],1,"Joyful എന്നതിന് സന്തോഷമുള്ള എന്നർത്ഥമാണ്."],
["Choose the antonym of 'Ancient'.","'Ancient' എന്ന വാക്കിന്റെ വിപരീതപദം തിരഞ്ഞെടുക്കുക.",["Old","Historic","Modern","Past"],2,"Ancient = പുരാതനമായത്; Modern = ആധുനികമായത്."],
["Fill in the blank: She ___ to school every day.","ശൂന്യസ്ഥലം പൂരിപ്പിക്കുക: She ___ to school every day.",["go","going","goes","gone"],2,"She എന്ന ഏകവചന subject-നൊപ്പം present simple-ൽ goes ഉപയോഗിക്കുന്നു."],
["Choose the correctly spelt word.","ശരിയായ അക്ഷരവിന്യാസമുള്ള വാക്ക് തിരഞ്ഞെടുക്കുക.",[" recieve","receive","receeve","receve"],1,"ശരിയായ spelling receive ആണ്."],
["What is the plural of 'Child'?","Child എന്നതിന്റെ ബഹുവചനം ഏത്?",["Childs","Childes","Children","Childrens"],2,"Child എന്നതിന്റെ irregular plural ആണ് Children."],
["Choose the opposite of 'Victory'.","Victory എന്നതിന്റെ വിപരീതം ഏത്?",["Success","Defeat","Win","Achievement"],1,"Victory = വിജയം; Defeat = പരാജയം."],

let current=0, answers={}, seconds=3600, clock=null, finished=false;

function startTest(){
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("test").classList.remove("hidden");
 current=0; answers={}; seconds=3600; finished=false;
 clearInterval(clock);
 showQuestion();
 clock=setInterval(()=>{
  if(finished)return;
  seconds--;
  document.getElementById("timer").textContent=
   Math.floor(seconds/60).toString().padStart(2,"0")+":"+ (seconds%60).toString().padStart(2,"0");
  if(seconds<=0)submitTest();
 },1000);
}
function showQuestion(){
 const q=questions[current];
 document.getElementById("progress").textContent="Question "+(current+1)+" / "+questions.length;
 document.getElementById("answered").textContent="Answered: "+Object.keys(answers).length;
 document.getElementById("question").textContent=(current+1)+". "+q[0];
 document.getElementById("malayalam").textContent=q[1];
 const box=document.getElementById("options");box.innerHTML="";
 q[2].forEach((opt,i)=>{
  const b=document.createElement("button");
  b.className="option"+(answers[current]===i?" selected":"");
  b.textContent=String.fromCharCode(65+i)+". "+opt.trim();
  b.onclick=()=>{answers[current]=i;showQuestion()};
  box.appendChild(b);
 });
}
function next(){if(current<questions.length-1){current++;showQuestion()}}
function previous(){if(current>0){current--;showQuestion()}}
function submitTest(){
 if(finished)return;
 finished=true;clearInterval(clock);
 let correct=0,wrong=0,unanswered=0;
 questions.forEach((q,i)=>{
  if(answers[i]===undefined)unanswered++;
  else if(answers[i]===q[3])correct++;
  else wrong++;
 });
 document.getElementById("test").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=correct+" / "+questions.length;
 document.getElementById("resultText").textContent=
  "Correct: "+correct+" | Wrong: "+wrong+" | Not answered: "+unanswered;
 const review=document.getElementById("review");review.innerHTML="<h3>Answer Key & Explanations / ഉത്തരങ്ങളും വിശദീകരണവും</h3>";
 questions.forEach((q,i)=>{
  const d=document.createElement("div");d.className="card";
  const your=answers[i]===undefined?"Not answered":q[2][answers[i]];
  d.innerHTML="<b>Q"+(i+1)+". "+q[0]+"</b><p>"+q[1]+"</p><p>Your answer: "+your+"</p><p>Correct answer: "+q[2][q[3]]+"</p><div id='exp"+i+"'></div>";
  review.appendChild(d);
  document.getElementById("exp"+i).textContent="വിശദീകരണം: "+q[4];
 });
}
function backHome(){
 clearInterval(clock);
 document.getElementById("result").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}
function comingSoon(name){alert(name+" Mock Test ഉടൻ ലഭ്യമാകും.")}
</script>
